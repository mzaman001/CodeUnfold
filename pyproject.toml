[project]
name = "codeunfold"
version = "0.2.0"
description = "AI-powered LeetCode tutor: paste a problem, get a step-by-step lesson instead of just an answer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# NOTE: runtime dependencies are declared in requirements.txt, not here,
# because Streamlit Community Cloud's deployment process specifically
# reads requirements.txt to install dependencies -- it does not read
# pyproject.toml. requirements-dev.txt covers the dev/test/lint-only
# tools (pytest, ruff). This file exists for project metadata and tool
# configuration (below), not as the dependency source of truth.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
# Defaults are fine for this project; nothing currently needs
# project-specific ignores. Kept as an explicit empty section so future
# additions have an obvious place to go instead of scattering inline
# `# noqa` comments.
